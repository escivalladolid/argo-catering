<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGO Catering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1638;
    --bg-wash: #12245c;
    --ink: #f8fafc;
    --ink-soft: #9aabd6;
    --blue: #5b9bff;
    --blue-deep: #2563eb;
    --blue-pale: rgba(255, 255, 255, 0.16);
    --ring: rgba(91, 155, 255, 0.22);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(circle at 50% 28%, var(--bg-wash) 0%, var(--bg) 60%);
    padding: 32px 24px;
  }

  /* ---------- ambient plate rings (signature element) ---------- */
  .rings{
    position:absolute;
    top:50%; left:50%;
    width:1px; height:1px;
    pointer-events:none;
    z-index:0;
  }
  .rings span{
    position:absolute;
    top:50%; left:50%;
    border:1px solid var(--ring);
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0;
    animation: ripple 5.5s ease-out infinite;
  }
  .rings span:nth-child(1){ width:220px; height:220px; animation-delay: 0.2s; }
  .rings span:nth-child(2){ width:220px; height:220px; animation-delay: 2s; }
  .rings span:nth-child(3){ width:220px; height:220px; animation-delay: 3.8s; }

  @keyframes ripple{
    0%   { width:180px; height:180px; opacity:0; }
    12%  { opacity:0.9; }
    100% { width:720px; height:720px; opacity:0; }
  }

  /* ---------- content stack ---------- */
  main{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:560px;
  }

  /* icon badge */
  .badge{
    width:84px; height:84px;
    border-radius:22px;
    background: linear-gradient(160deg, var(--blue) 0%, var(--blue-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 14px 30px -10px rgba(29,78,216,0.45);
    opacity:0;
    transform: scale(0.6) translateY(10px);
    animation: pop-in 0.7s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }
  .badge svg{ width:44px; height:44px; }

  @keyframes pop-in{
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .eyebrow{
    margin-top: 26px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--blue);
    opacity:0;
    animation: rise-in 0.6s ease-out 0.5s forwards;
  }

  h1{
    margin-top: 10px;
    font-size: clamp(52px, 10vw, 88px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.98;
    color: var(--ink);
    opacity:0;
    animation: rise-in 0.7s ease-out 0.65s forwards;
  }

  h1 span{
    color: var(--blue);
  }

  .quote{
    margin-top: 22px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
    max-width: 420px;
    line-height: 1.55;
    opacity:0;
    animation: rise-in 0.6s ease-out 0.85s forwards;
  }

  .quote::before, .quote::after{ content: '"'; color: var(--blue); }

  .actions{
    margin-top: 40px;
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content:center;
    opacity:0;
    animation: rise-in 0.6s ease-out 1.05s forwards;
  }

  .btn{
    appearance:none;
    border:none;
    text-decoration:none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 26px;
    border-radius: 12px;
    cursor:pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }

  .btn-primary{
    background: var(--blue);
    color:#fff;
    box-shadow: 0 10px 22px -8px rgba(37,99,235,0.55);
  }
  .btn-primary:hover{ background: var(--blue-deep); transform: translateY(-2px); }

  .btn-ghost{
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--blue-pale);
  }
  .btn-ghost:hover{ border-color: var(--blue); background: rgba(255,255,255,0.05); transform: translateY(-2px); }

  @keyframes rise-in{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  footer{
    position:absolute;
    bottom: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity:0;
    animation: rise-in 0.6s ease-out 1.2s forwards;
  }

  .staff-link{
    position:fixed;
    top: 22px;
    right: 24px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    letter-spacing: 0.01em;
    z-index: 3;
    opacity:0;
    animation: rise-in 0.6s ease-out 1.1s forwards;
    transition: color 0.18s ease;
  }
  .staff-link:hover{ color: var(--blue); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    .rings span{ display:none; }
  }

  /* tap ripple */
  .tap-ring{
    position:fixed;
    width:16px; height:16px;
    border:1.5px solid var(--blue);
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:2;
    opacity:0.9;
    animation: tap-out 0.9s cubic-bezier(.2,.7,.2,1) forwards;
  }

  @keyframes tap-out{
    0%   { width:16px; height:16px; opacity:0.9; }
    100% { width:340px; height:340px; opacity:0; }
  }

  /* ---------- responsive adjustments ---------- */
  @media (max-width: 480px){
    body{ padding: 96px 20px 84px; }

    .staff-link{ top: 18px; right: 18px; font-size: 12px; }

    .badge{ width: 68px; height: 68px; border-radius: 18px; }
    .badge svg{ width: 36px; height: 36px; }

    .eyebrow{ font-size: 11px; letter-spacing: 0.16em; }

    .quote{ font-size: 15px; max-width: 320px; }

    .actions{ width: 100%; }
    .btn{ width: 100%; justify-content:center; padding: 14px 22px; }

    footer{ font-size: 11px; padding: 0 20px; text-align:center; }
  }

  @media (max-height: 620px){
    body{ padding-top: 84px; padding-bottom: 72px; }
    .badge{ width: 60px; height: 60px; }
    .badge svg{ width: 32px; height: 32px; }
    .eyebrow{ margin-top: 16px; }
    .quote{ margin-top: 14px; }
    .actions{ margin-top: 26px; }
    footer{ position: static; margin-top: 28px; opacity:1; animation:none; }
  }
</style>
</head>
<body>

  <div class="rings"><span></span><span></span><span></span></div>

  <a href="/admin" class="staff-link">Staff Login</a>

  <main>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3C7.5 3 4 6.5 4 11H20C20 6.5 16.5 3 12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M2.5 11H21.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 3V1.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4.5 14.5H19.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="eyebrow">Catering Management System</div>

    <h1>ARG<span>O</span></h1>

    <p class="quote">Every great event starts with the right plan on the table.</p>

    <div class="actions">
      <a href="/customer" class="btn btn-primary">Get Started</a>
    </div>
  </main>

  <footer>ARGO Catering Management System</footer>

  <script>
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    document.body.addEventListener('pointerdown', function(e){
      if (reduceMotion) return;
      if (e.target.closest('.btn') || e.target.closest('.staff-link')) return;

      var ring = document.createElement('div');
      ring.className = 'tap-ring';
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
      document.body.appendChild(ring);
      ring.addEventListener('animationend', function(){ ring.remove(); });
    });
  </script>

</body>
</html>
